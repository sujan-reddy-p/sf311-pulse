name: CI

on:
  push:
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python -m sf311_pulse.cli --database /tmp/sf311-pulse-ci.sqlite
